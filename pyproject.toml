[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envgrave"
version = "1.0.0"
description = "Scan projects for unused, missing, duplicated, or misconfigured environment variables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "EnvGrave"}]
keywords = ["environment", "env", "dotenv", "cli", "audit", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
[project.urls]
Homepage = "https://github.com/Mubloxi/envgrave"
Repository = "https://github.com/Mubloxi/envgrave"
Issues = "https://github.com/Mubloxi/envgrave/issues"

[project.scripts]
envgrave = "envgrave.cli:main"

[tool.setuptools.packages.find]
include = ["envgrave*"]
