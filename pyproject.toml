[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envgrave"
version = "1.0.0"
description = "Scan projects for unused, missing, duplicated, or misconfigured environment variables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "EnvGrave"}]

[project.scripts]
envgrave = "envgrave.cli:main"

[tool.setuptools.packages.find]
include = ["envgrave*"]
