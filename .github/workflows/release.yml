name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -t .

  release-assets:
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          pip install build pyinstaller

      - name: Run tests
        run: |
          pip install .
          python -m unittest discover -s tests -t .

      - name: Build wheel and sdist (Linux only)
        if: runner.os == 'Linux'
        run: python -m build

      - name: Upload wheel and sdist (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Build standalone executable (one-directory for fast startup)
        run: |
          pyinstaller --onedir --clean --name envgrave envgrave/__main__.py

      - name: Test standalone executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/envgrave/envgrave.exe --version
            ./dist/envgrave/envgrave.exe --help | head -5
          else
            ./dist/envgrave/envgrave --version
            ./dist/envgrave/envgrave --help | head -5
          fi

      - name: Create versioned archive
        shell: bash
        run: |
          VERSION="1.0.0"
          case "${{ runner.os }}" in
            Windows)
              PLATFORM="windows-x64"
              7z a "envgrave-${VERSION}-${PLATFORM}.zip" dist/envgrave/
              ;;
            Linux)
              PLATFORM="linux-x64"
              tar czf "envgrave-${VERSION}-${PLATFORM}.tar.gz" -C dist envgrave/
              ;;
            macOS)
              if [ "$(uname -m)" = "arm64" ]; then
                PLATFORM="macos-arm64"
              else
                PLATFORM="macos-x64"
              fi
              tar czf "envgrave-${VERSION}-${PLATFORM}.tar.gz" -C dist envgrave/
              ;;
          esac
          echo "ARCHIVE=envgrave-${VERSION}-${PLATFORM}" >> $GITHUB_ENV

      - name: Upload standalone archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*

  create-release:
    needs: release-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**
